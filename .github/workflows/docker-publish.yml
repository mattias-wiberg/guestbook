name: Build and Deploy

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-build-deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: dev
      tag_prefix: dev-
      latest_tag: dev-latest
    secrets: inherit

  deploy-prod:
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/docker-build-deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: prod
      tag_prefix: prod-
      latest_tag: prod-latest
    secrets: inherit
